name: CD & Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag version (e.g. 0.1.0). Leave empty for auto-bump starting from 0.0.1'
        required: false
        type: string
      publish_docker:
        description: 'Push backend Docker image to GHCR'
        type: boolean
        default: true

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ksu-backend

jobs:
  prepare-version:
    name: Compute Release Version
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    outputs:
      version: ${{ steps.calc.outputs.version }}
      version_code: ${{ steps.calc.outputs.version_code }}
      sha: ${{ steps.calc.outputs.sha }}
      should_release: ${{ steps.calc.outputs.should_release }}
    steps:
      - name: Checkout repository with full tag history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Calculate next semver tag
        id: calc
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          TARGET_SHA="$(git rev-parse HEAD)"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "push" ]; then
            TAG_NAME="${REF_NAME#v}"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION:-}" ]; then
            TAG_NAME="${INPUT_VERSION#v}"
          else
            EXISTING_ON_HEAD="$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [ -n "$EXISTING_ON_HEAD" ] && [ "$EVENT_NAME" = "workflow_run" ]; then
              echo "Commit $TARGET_SHA already has release tag $EXISTING_ON_HEAD; skipping duplicate release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "version=${EXISTING_ON_HEAD#v}" >> "$GITHUB_OUTPUT"
              echo "version_code=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            LATEST_TAG="$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1 || true)"
            if [ -z "$LATEST_TAG" ]; then
              TAG_NAME="0.0.1"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
              PATCH=$((10#$PATCH + 1))
              TAG_NAME="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          if ! [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semver version: $TAG_NAME (expected X.Y.Z, e.g. 0.0.1)" >&2
            exit 1
          fi

          IFS='.' read -r MAJ MIN PAT <<< "$TAG_NAME"
          VERSION_CODE=$((10#$MAJ * 10000 + 10#$MIN * 100 + 10#$PAT))
          if [ "$VERSION_CODE" -lt 1 ]; then
            VERSION_CODE=1
          fi

          echo "Resolved release version: $TAG_NAME (versionCode=$VERSION_CODE, sha=$TARGET_SHA)"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  backend-docker:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest
    needs: [prepare-version]
    if: >
      needs.prepare-version.outputs.should_release == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_docker == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare-version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-release-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [prepare-version]
    if: needs.prepare-version.outputs.should_release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK licenses are accepted
        shell: bash
        run: |
          set +o pipefail
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build backend fat JAR
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew check buildFatJar --no-daemon

      - name: Decode Android release keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            echo "path=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_OUTPUT"
          else
            echo "ANDROID_KEYSTORE_BASE64 is not set; building unsigned release APK alongside installable debug APK."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APKs
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ needs.prepare-version.outputs.version }}
          APP_VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
          MAPKIT_API_KEY: ${{ secrets.MAPKIT_API_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon

      - name: Collect release artifacts
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |
          mkdir -p release-artifacts
          cp backend/build/libs/backend-all.jar "release-artifacts/ksu-backend-${VERSION}.jar"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/ksu-android-debug-${VERSION}.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/ksu-android-release-${VERSION}.apk"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "release-artifacts/ksu-android-release-unsigned-${VERSION}.apk"
          fi
          ls -lh release-artifacts/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-version, backend-docker, build-release-artifacts]
    if: >
      always() &&
      needs.prepare-version.outputs.should_release == 'true' &&
      needs.build-release-artifacts.result == 'success' &&
      (needs.backend-docker.result == 'success' || needs.backend-docker.result == 'skipped')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.version }}
          name: Release ${{ needs.prepare-version.outputs.version }}
          target_commitish: ${{ needs.prepare-version.outputs.sha }}
          generate_release_notes: true
          files: release-artifacts/*
